[project]
name = "padel-vision"
version = "0.1.0"
description = "Computer vision applied to padel — analyze video clips and produce Playtomic-style skill scores, shot classification, and ball trajectory analysis."
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.38",
    "opencv-python>=4.13.0",
    "mediapipe>=0.10.33",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "fastapi>=0.136.0",
    "pydantic>=2.13.2",
    "celery>=5.6.3",
    "redis>=5.0.0",
    "lap>=0.5.13",
    "python-multipart>=0.0.26",
]

[project.scripts]
padelvision = "padelvision.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.20.1",
    "ruff>=0.15.11",
    "pyright>=1.1.408",
    "opencv-python-headless>=4.13.0.92",
    "types-opencv-python>=1.0.11",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padelvision"]
